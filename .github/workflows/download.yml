name: DownloadAndRelay
on:
  push:
    branches: [ main ]
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          curl -s -L --max-time 1800 --retry 3 -o /tmp/yj.exe "https://update.yanjian.asia/stable/windows-x64/full/1.1.26/8ec0e1ee3e5f/YanJian-Setup-v1.1.26.exe"
          size=$(stat -c%s /tmp/yj.exe)
          echo "downloaded size=$size"
          if [ "$size" != "867060315" ]; then echo "SIZE MISMATCH"; exit 1; fi
      - name: Upload
        id: upload
        run: |
          url=$(curl -s --max-time 1800 -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@/tmp/yj.exe" "https://litterbox.catbox.moe/resources/internals/api.php")
          echo "UPLOAD_URL=$url"
          echo "relay_url=$url" >> $GITHUB_OUTPUT
      - name: PostUrl
        run: |
          curl -s --max-time 30 -X POST "https://webhook.site/c76d969d-fc63-4e09-992f-d2e52777ad44/relay" -d "${{ steps.upload.outputs.relay_url }}"
          echo "posted"